name: Refresh series catalog

# Re-downloads the BCRPData series catalog every Monday and commits it if it changed.
# The new catalog reaches npm users with the next release; anyone can also run `bcrp catalog update` at any time.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Download and rebuild the catalog
        run: bun run catalog
      - name: Check it still works
        run: bun run typecheck && bun test
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/catalog.json; then
            echo "Catalog unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json
          git commit -m "chore: refresh series catalog"
          git push
