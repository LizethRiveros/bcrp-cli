<style>
/* Siempre oscuro: la foto de la sede del BCRP al fondo, tarjetas de vidrio encima. */
:root { --fg: #f6f2e8; --muted: #c9c6bb; --glass: rgb(20 24 26 / .52); --edge: rgb(255 255 255 / .16); --up: #ffb877; --down: #9be0ab; --gold: #f0b070;
  --serif: "Fraunces", ui-serif, Georgia, serif; --sans: "Inter", ui-sans-serif, system-ui, sans-serif; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: #14181a; }
body { color: var(--fg); font: 15px/1.4 var(--sans); min-height: 100dvh; position: relative;
  padding: max(20px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom)); }
body::before { content: ""; position: fixed; inset: 0; z-index: -2; background: url(../preguntar/bcrp-sede.jpg) center 30% / cover; transform: scale(1.06); }
body::after { content: ""; position: fixed; inset: 0; z-index: -1;
  background: linear-gradient(180deg, rgb(10 12 13 / .55), rgb(10 12 13 / .35) 40%, rgb(10 12 13 / .85)); }
main { max-width: 420px; margin: 0 auto; }
header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; padding: 0 4px; }
header b { font: 600 13px var(--sans); letter-spacing: .14em; color: var(--gold); }
header span { font-size: 12px; color: var(--muted); margin-right: auto; margin-left: 10px; }
header button { font: 500 12px var(--sans); color: var(--fg); background: rgb(255 255 255 / .12); border: 1px solid var(--edge); border-radius: 99px; padding: 6px 13px; cursor: pointer; }
#panel { margin-bottom: 12px; padding: 14px; border-radius: 22px; background: var(--glass); border: 1px solid var(--edge);
  -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); animation: in .4s cubic-bezier(.22,1,.36,1) forwards; }
#panel[hidden] { display: none; }
.ptitle { font: 600 14px var(--sans); margin-bottom: 10px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; border-radius: 99px; background: rgb(255 255 255 / .08); }
.seg button { font: 500 13px var(--sans); color: var(--muted); background: transparent; border: 0; border-radius: 99px; padding: 8px 4px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--gold); color: #231f18; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.opts button { font: 400 13px var(--sans); color: var(--fg); background: transparent; border: 1px solid var(--edge); border-radius: 99px; padding: 7px 12px; cursor: pointer; }
.opts button[aria-pressed="true"] { border-color: var(--gold); background: rgb(240 176 112 / .16); }
.hint { margin-top: 10px; font-size: 12px; color: var(--muted); }
.grid { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 12px; }
.tile { position: relative; overflow: hidden; border-radius: 24px; padding: 16px 16px 12px; min-height: 188px;
  background: linear-gradient(160deg, rgb(255 255 255 / .12), rgb(255 255 255 / .03)), var(--glass);
  border: 1px solid var(--edge); box-shadow: 0 10px 30px rgb(0 0 0 / .28), inset 0 1px 0 rgb(255 255 255 / .12);
  -webkit-backdrop-filter: blur(18px) saturate(1.4); backdrop-filter: blur(18px) saturate(1.4);
  display: flex; flex-direction: column; opacity: 0; transform: translateY(14px); animation: in .7s cubic-bezier(.22,1,.36,1) forwards; }
.tile.hero { grid-column: 1 / -1; min-height: 210px; }
@keyframes in { to { opacity: 1; transform: none; } }
.label { font-size: 12px; font-weight: 500; letter-spacing: .04em; color: var(--muted); text-transform: uppercase; }
.value { white-space: nowrap; font: 600 25px/1.1 var(--serif); letter-spacing: -.02em; font-variant-numeric: tabular-nums; margin-top: 8px; }
.hero .value { font-size: 52px; }
.delta { display: inline-block; margin-top: 6px; font-size: 12.5px; font-weight: 600; padding: 2px 9px; border-radius: 99px; background: rgb(255 255 255 / .1); color: var(--muted); }
.delta.up { color: var(--up); background: rgb(255 184 119 / .14); } .delta.down { color: var(--down); background: rgb(155 224 171 / .14); }
.when { font-size: 11px; color: var(--muted); margin-top: auto; padding-top: 6px; opacity: .85; }
svg.spark { position: absolute; left: 0; right: 0; bottom: 26px; width: 100%; height: 38px; pointer-events: none; }
.hero svg.spark { height: 78px; bottom: 26px; }
svg.spark path.line { fill: none; stroke: var(--gold); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke;
  stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.4s .35s cubic-bezier(.22,1,.36,1) forwards; }
svg.spark path.area { fill: url(#g); opacity: 0; animation: fade 1s .9s forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } } @keyframes fade { to { opacity: 1; } }
footer { margin-top: 18px; font-size: 12px; color: var(--muted); text-align: center; }
footer a { color: inherit; }
@media (prefers-reduced-motion: reduce) { * { animation-duration: .01s !important; animation-delay: 0s !important; } }
</style>

<body>
<main>
  <header><b>BCRP</b><span>al 23 oct 2026</span><button type="button" id="pick" aria-expanded="false" aria-controls="panel">Elegir</button></header>
  <section id="panel" hidden>
    <p class="ptitle">¿Qué quieres ver?</p>
    <div class="seg" role="group" aria-label="Cuántos indicadores">
      <button type="button" data-mode="uno">Solo uno</button><button type="button" data-mode="varios">Varios</button><button type="button" data-mode="todos">Todos</button>
    </div>
    <div class="opts" id="opts"></div>
    <p class="hint" id="hint"></p>
  </section>
  <div class="grid" id="grid"></div>
  <footer>Fuente: BCRP · revisado el 27 oct 2026 · <a href="../preguntar/">Pregúntale al BCRP</a></footer>
</main>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0b070" stop-opacity=".38"/><stop offset="1" stop-color="#f0b070" stop-opacity="0"/></linearGradient></defs></svg>
<script>
const DATA = [{"id":"fx","label":"Dólar","display":"S/ 3.449","when":"23 oct 2026","delta":{"up":true,"text":"1.80%","from":"23 sep 2026"},"spark":[3.36757142857143,3.38085714285714,3.376,3.36671428571429,3.36371428571429,3.3585,3.35514285714286,3.36064285714286,3.38778571428571,3.40557142857143,3.41992857142857,3.439,3.44514285714286,3.432,3.45385714285714,3.43814285714286,3.42714285714286,3.43471428571429,3.44978571428571,3.45385714285714,3.43892857142857,3.43785714285714,3.43914285714286,3.42821428571429,3.42828571428571,3.43928571428571,3.43092857142857,3.43357142857143,3.44671428571429,3.44871428571429]},{"id":"euro","label":"Euro","display":"S/ 4.055","when":"23 oct 2026","delta":{"up":true,"text":"2.71%","from":"23 sep 2026"},"spark":[3.915,4.11,3.888,3.901,4.054,3.877,3.952,3.863,3.948,3.883,4.053,4.053,3.905,4.108,4.094,4.087,4.001,3.879,4.051,3.851,3.867,3.867,3.889,3.858,4.034,4.045,3.995,3.871,3.893,4.055]},{"id":"inflation","label":"Inflación","display":"4.55%","when":"sep 2026","delta":{"up":true,"text":"0.11 puntos","from":"ago 2026"},"spark":[1.35177475650182,1.36861256988846,1.50879973918667,1.70091694832201,2.21416625767848,3.80454581291585,4.01414363472928,3.90505240621645,4.00890965651766,4.06515256208199,4.43780929778608,4.54865469481509]},{"id":"rate","label":"Tasa de referencia","display":"4.25%","when":"26 oct 2026","delta":{"up":false,"text":"0.00 puntos","from":"25 sep 2026"},"spark":[4.25,4.25,4.25,4.25,4.25,4.25,4.25,4.25,4.25,4.25,4.25,4.25,4.25,4.25,4.25,4.25,4.25,4.25,4.25,4.25,4.25,4.25,4.25,4.25,4.25,4.25,4.25,4.25,4.25,4.25]},{"id":"reserves","label":"Reservas internacionales netas","display":"US$ 96,396","when":"23 oct 2026","delta":{"up":false,"text":"0.64%","from":"23 sep 2026"},"spark":[98123.56226673,97798.45458647,97683.30618227,97236.83895739,97606.33426211,97257.30386894,97049.32110984,96945.86427817,97021.54330187,96661.46794133,96579.44341368,95140.06321636,92735.5339654,92179.51353365,95661,95887.23676532,95745.75316568,96047.84383094,96049.86991361,96239.93461021,96204.65320583,96468.77438073,96173.00737678,96246.41940454,96654.60272427,96371.954121,96380.43831941,96754.53818488,96692.46397828,96396.45009495]},{"id":"gdp","label":"PBI","display":"3.2%","when":"ago 2026","delta":{"up":false,"text":"0.3 puntos","from":"jul 2026"},"spark":[4.39260049012083,4.17632153639052,1.58920236608024,4.14063348002019,3.75563441378696,3.68037764645394,3.26792981233946,3.80791279395248,2.17541272858415,1.7513508584607,3.5592604174106,3.23276441886908]},{"id":"unemployment","label":"Desempleo en Lima","display":"4.4%","when":"sep 2026","delta":{"up":false,"text":"0.4 puntos","from":"ago 2026"},"spark":[5.93693531631924,5.92567917868739,4.98799670957274,6.33489418457471,6.36994305290923,6.84335458752875,5.31907056690782,4.97860650938346,4.91312664821157,4.68136660632325,4.80377918575145,4.37168029006711]},{"id":"gold","label":"Oro","display":"US$ 3,996.10","when":"23 oct 2026","delta":{"up":false,"text":"6.80%","from":"23 sep 2026"},"spark":[4299.64,4292.15,4263.65,4341.7,4378.63,4343.43,4360.72,4287.65,4275.03,4284.81,4115.71,4182.31,4157.41,4177.66,4141.19,4139.5,4164.18,4111.23,4132.5,4194.24,4172.23,4160.74,4105.37,4171.44,4165.58,4140.72,4125.2,4140.74,4024.85,3996.1]},{"id":"copper","label":"Cobre","display":"653.85","when":"23 oct 2026","delta":{"up":false,"text":"2.17%","from":"23 sep 2026"},"spark":[637.025130741198,637.070489978648,645.325871194462,653.195698891955,659.02436090422,670.772403403648,671.180636540694,668.368363818823,669.729140942309,668.595160006071,659.727429084688,656.552282463221,657.11927293134,650.224668839011,651.131853588002,654.533796396717,657.935739205431,658.162535392679,658.888283191871,666.281838896145,672.314617476932,668.64051924352,669.094111618016,659.477953278715,662.018070575889,657.527506068386,659.523312516165,655.032748008661,644.781560345068,653.853407834974]},{"id":"silver","label":"Plata","display":"US$ 53.89","when":"23 oct 2026","delta":{"up":false,"text":"16.40%","from":"23 sep 2026"},"spark":[63.2298,63.6452,62.9568,65.1923,66.2324,66.025,67.075,64.465,63.905,64.2805,60.965,61.4515,60.4067,60.8492,60.3917,61.05,61.685,60.145,59.3425,60.8052,60.315,59.4395,55.6375,57.4375,57.0057,57.085,57.98,57.97,54.525,53.8949]}];
// Por defecto solo el dólar, para no llenar la pantalla. Cada persona elige y su elección se recuerda en su teléfono.
// ?t=fx,euro,gold fuerza una selección (sirve para compartir un enlace); la primera ficha se muestra grande.
const grid = document.getElementById("grid");
const ALL = DATA.map((t) => t.id);
const KEY = "bcrp-widget";
const DEF = { mode: "uno", uno: "fx", varios: ["fx", "euro", "inflation"] };
let st = { ...DEF };
try { st = { ...DEF, ...JSON.parse(localStorage.getItem(KEY) || "{}") }; } catch (e) {}
const forced = (new URLSearchParams(location.search).get("t") || "").split(",").filter((id) => ALL.includes(id));
if (forced.length) st = { mode: forced.length === 1 ? "uno" : "varios", uno: forced[0], varios: forced };
const ids = () => (st.mode === "todos" ? ALL : st.mode === "uno" ? [st.uno] : st.varios);
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };
function spark(v) {
  if (!v || v.length < 2) return "";
  const lo = Math.min(...v), hi = Math.max(...v), r = hi - lo || 1;
  const pts = v.map((y, i) => [(i / (v.length - 1)) * 100, 4 + (1 - (y - lo) / r) * 32]);
  const line = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(2) + " " + p[1].toFixed(2)).join(" ");
  return '<svg class="spark" viewBox="0 0 100 40" preserveAspectRatio="none"><path class="area" d="' + line + ' L100 40 L0 40 Z"/><path class="line" pathLength="1" d="' + line + '"/></svg>';
}
function render() {
  grid.innerHTML = "";
  ids().forEach((id, i) => {
  const t = DATA.find((x) => x.id === id);
  if (!t) return;
  const el = document.createElement("div");
  el.className = "tile" + (i === 0 ? " hero" : "");
  el.style.animationDelay = i * 90 + "ms";
  const d = t.delta;
  const flat = d && parseFloat(d.text) === 0;
  const chip = !d ? "" : flat ? '<span class="delta">sin cambio</span>' : '<span class="delta ' + (d.up ? "up" : "down") + '">' + (d.up ? "▲ " : "▼ ") + d.text + "</span>";
  el.innerHTML = '<div class="label"></div><div class="value"></div><div>' + chip + "</div>" + spark(t.spark) + '<div class="when"></div>';
  el.querySelector(".label").textContent = t.label;
  el.querySelector(".value").textContent = t.display;
  el.querySelector(".when").textContent = t.when;
  grid.appendChild(el);
  });
}

const panel = document.getElementById("panel");
const opts = document.getElementById("opts");
function renderPanel() {
  document.querySelectorAll(".seg button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.mode === st.mode)));
  opts.hidden = st.mode === "todos";
  opts.innerHTML = "";
  if (st.mode !== "todos") {
    DATA.forEach((t) => {
      const on = st.mode === "uno" ? st.uno === t.id : st.varios.includes(t.id);
      const b = document.createElement("button");
      b.type = "button";
      b.dataset.id = t.id;
      b.setAttribute("aria-pressed", String(on));
      b.textContent = t.label;
      opts.appendChild(b);
    });
  }
  document.getElementById("hint").textContent =
    st.mode === "uno" ? "Se muestra una sola ficha, grande." : st.mode === "varios" ? "Toca para sumar o quitar. Mínimo una." : "Se muestran los " + ALL.length + " indicadores.";
}
document.getElementById("pick").addEventListener("click", (e) => {
  panel.hidden = !panel.hidden;
  e.currentTarget.setAttribute("aria-expanded", String(!panel.hidden));
  e.currentTarget.textContent = panel.hidden ? "Elegir" : "Listo";
});
document.querySelector(".seg").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  st.mode = b.dataset.mode;
  if (st.mode === "uno" && !ALL.includes(st.uno)) st.uno = "fx";
  save(); renderPanel(); render();
});
opts.addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  const id = b.dataset.id;
  if (st.mode === "uno") st.uno = id;
  else if (st.varios.includes(id)) { if (st.varios.length > 1) st.varios = st.varios.filter((x) => x !== id); }
  else st.varios = [...st.varios, id];
  save(); renderPanel(); render();
});
renderPanel();
render();
</script>
</body>
</html>
