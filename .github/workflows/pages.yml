name: Demo page

# Publishes docs/ to GitHub Pages. On a schedule (and manually) it first regenerates the page with fresh data from
# the BCRP; if that fails (for example the BCRP blocks the request) it deploys the committed snapshot instead.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/build-demo.ts"
      - "scripts/build-ask.ts"
      - "scripts/ask.template.html"
      - "scripts/build-series.ts"
      - "scripts/series.template.html"
      - "api/**"
      - "scripts/demo.template.html"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "30 14 * * 1-5" # weekdays, 9:30 am in Lima (the BCRP publishes the day's figures in the morning)
    - cron: "0 23 * * 1-5" # weekdays, 6 pm in Lima
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Refresh the data
        id: refresh
        continue-on-error: true
        run: bun run demo && sleep 2 && bun run ask && bun run series
      - name: Warn when the snapshot is stale
        if: steps.refresh.outcome == 'failure'
        run: echo "::warning::Could not refresh the data from the BCRP; deploying the committed snapshot."
      - name: Commit refreshed data
        # Vercel redeploys on every push to main, so committing docs/ is what updates the Vercel site.
        # If main becomes protected and the push is rejected, warn and still deploy GitHub Pages.
        id: commit
        if: steps.refresh.outcome == 'success'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || (git commit -m "chore: refresh data [skip ci]" && git push)
      - name: Warn when the push was rejected
        if: steps.commit.outcome == 'failure'
        run: echo "::warning::Could not push the refreshed data to main (branch protection?). Vercel will keep the last committed snapshot."
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
