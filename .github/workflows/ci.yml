name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - name: Smoke test the built CLI on Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node dist/cli.js --version && node dist/cli.js shortcuts --json
